name: Template update (Cruft)

on:
  schedule:
    - cron: "0 18 * * 5" # 18:00 UTC (19:00 Europe/Rome) on Fridays
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cruft-template-update
  cancel-in-progress: false

jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Sync dev tools (installs cruft from dev group)
        run: uv sync --group dev

      - name: Check and update from template
        id: cruft_update
        env:
          CRUFT_NO_INPUT: "1"
        run: |
          set -e
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          if ! uv run cruft check; then
            uv run cruft update -y --allow-untracked-files
            # Remove any leftover .rej files from conflicts
            find . -name "*.rej" -type f -delete
            # Always regenerate lock file to ensure consistency after template update
            uv lock
            if ! git diff --quiet HEAD; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate GitHub App token
        id: app_token
        if: ${{ steps.cruft_update.outputs.has_changes == 'true' }}
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: ${{ steps.cruft_update.outputs.has_changes == 'true' }}
        env:
          # The App token can push to .github/workflows/* (unlike github.token); it's the primary credential.
          # github.token is a fallback for ordinary updates when the App isn't installed/configured yet.
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/update-template"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(template): apply cookiecutter updates via Cruft"

          push_with_token() {
            git remote set-url origin "https://x-access-token:${1}@github.com/${{ github.repository }}.git"
            git push -f origin "$BRANCH"
          }

          if [ -n "$APP_TOKEN" ] && push_with_token "$APP_TOKEN"; then
            GH_TOKEN="$APP_TOKEN"
          else
            echo "::warning::GitHub App token missing or push failed; falling back to github.token (this fails if Cruft touched .github/workflows/*)."
            push_with_token "$DEFAULT_TOKEN"
            GH_TOKEN="$DEFAULT_TOKEN"
          fi
          export GH_TOKEN

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q "OPEN"; then
            echo "PR already exists, updated branch."
          else
            gh label create "update-template" --color "0075ca" --description "Template update via Cruft" --force
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(template): apply latest cookiecutter updates" \
              --body "Automated Cruft update from cookiecutter template." \
              --label "update-template"
          fi
