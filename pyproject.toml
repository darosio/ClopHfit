[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ name = "daniele arosio", email = "daniele.arosio@cnr.it" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Unix Shell",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Development Status :: 3 - Alpha",
]
dependencies = [
  "arviz>=1.3.0",
  "click>=8.5.0",
  "corner>=2.3.0",
  "emcee>=3.1.6",
  "lmfit>=1.3.4",
  "matplotlib>=3.11.2",
  "nutpie>=0.16.11", # default NUTS sampler: robust on hierarchical latent-x models
  "odrpack>=0.7.0",
  "openpyxl>=3.1.5",
  "pandas>=3.1.0",
  "pyparsing>=3.3.3",
  "pymc>=6.3.2", # pytensor will load numpy < 2
  "scipy>=1.18.1",
  "seaborn>=0.13.2",
  "sympy>=1.14.0",
  "tqdm>=4.70.1",
  "uncertainties>=3.2.3",
  "xlrd>=2.0.2",
  "h5netcdf>=1.8.1",
  "h5py>=3.16.0",
]
description = "Cli for fitting macromolecule pH titration or binding assays data e.g. fluorescence spectra."
keywords = ["svd", "ClopHensor", "data fitting", "pH", "macromolecule binding"]
license = "BSD-3-Clause"
name = "clophfit"
readme = "README.md"
requires-python = ">=3.13"
version = "0.15.3"

[project.optional-dependencies]
gpu = [
  "blackjax>=1.7.1",
  "jax[cuda12]>=0.12.0.1",
  "numpyro>=0.22.0",
]
docs = [
  "graphviz>=0.21",
  "ipykernel>=7.4.0",
  "jupyter>=1.1.1",
  "myst-nb>=1.4.0",
  "pydata-sphinx-theme>=0.23.0",
  "pygments>=2.21.0",
  "sphinx-autoapi>=3.8.1",
  "sphinx-click>=6.2.0",
  "sphinx>=9.2.0",
  "sphinxcontrib-plantuml>=0.31",
]

[dependency-groups]
dev = [
  "git-cliff>=2.14.2",
  "mdformat>=1.0.0",
  "mdformat-gfm>=1.0.0",
  "pylsp-mypy>=0.8.2",
  "ruff>=0.17.2",
  "python-lsp-ruff>=2.3.4",
  "cruft>=2.16.0",
]
lint = [
  "pre-commit==4.7.0",
]
tests = [
  "coverage[toml]>=7.17.0",
  "mypy>=2.4.0",
  "pandas-stubs>=3.0.5.260914",
  "pygments>=2.21.0", # color xdoctest
  "pytest>=9.1.1",
  "scipy-stubs>=1.18.1.1",
  "types-click>=7.1.8",
  "types-setuptools>=84.0.0.20261006",
  "xdoctest>=1.3.2",
]

[project.scripts]
"clop" = "clophfit.__main__:clop"
"fit-titration" = "clophfit.__main__:fit_titration"
"note_to_csv" = "clophfit.__main__:note2csv"
"ppr" = "clophfit.__main__:ppr"

[project.urls]
"Bug Tracker" = "https://github.com/darosio/ClopHfit/issues"
Changelog = "https://github.com/darosio/ClopHfit/blob/main/CHANGELOG.md"
# Discussions = "https://github.com/darosio/ClopHfit/discussions"
Documentation = "https://clophfit.readthedocs.io"
"Github releases" = "https://github.com/darosio/ClopHfit/releases"
Homepage = "https://github.com/darosio/ClopHfit"

[tool.uv]
# pytensor caps numba at <=0.65.1 and every stable numba in that range pins
# numpy<2.5; without this, uv falls back to the numba 0.63.0b1 prerelease, whose
# metadata drops that bound but whose code still calls the removed np.row_stack.
prerelease = "disallow"

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
# fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
omit = ["*__init__.py", "*/old/*", "types.py"]
source = ["clophfit"]

[tool.isort]
combine_as_imports = true
force_single_line = false
include_trailing_comma = true
known_first_party = "clophfit"
line_length = 88 # to match black's default line length
multi_line_output = 3
profile = "black"

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
exclude = "src/clophfit/old"
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict = true
warn_unreachable = true
warn_unused_configs = true

# TODO: check
[tool.pydoclint]
check-class-attributes = false

[tool.pylsp-mypy]
dmypy = false
enabled = true
live_mode = true
strict = true

[tool.ruff]
extend-exclude = ["src/clophfit/old/", "scripts/", "benchmarks/", "prtecan_devel.ipynb"]
extend-include = ["*.ipynb"]
fix = true
force-exclude = true
line-length = 88
target-version = "py313"
unsafe-fixes = true
# Enable preview mode
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "line-too-long",
  "T20",
  "docstring-missing-returns", # Missing return section in docstring - too strict for scientific code
  "docstring-missing-exception", # Missing exception documentation - too strict
  "too-many-locals", # Too many local variables - common in scientific functions
  "too-many-nested-blocks", # Too many nested blocks - common in data processing
]
select = [
  "A", # builtins
  "AIR", # airflow
  "ANN", # typing annotation
  "ARG", # unused arguments
  "ASYNC",
  "B", # bugbear
  "BLE", # blind-except
  "C",
  "C4", # comprehensions
  "C90", # mccabe
  "D", # pydocstyle
  "DOC",
  "DTZ", # dates
  "E", # pycodestyle
  "EM", # exceptions
  "ERA", # eradicate
  "EXE",
  "F", # pyflakes
  "FA", # future annotations
  "FBT", # boolean-trap
  "FLY", # flyntp
  "FURB", # refurbishing and modernizing
  "G", # logging
  "I", # isort
  "ICN", # import conventions (opinionated)
  "INP", # inplict namespace
  "INT", # gettext
  "ISC", # implicit-str-concat
  "LOG", # logging
  "N", # pep8-naming
  "NPY",
  "PD", # pandas-vet
  "PERF", # pperformance anti pattern
  "PGH", # pygrep WAIT
  "PIE",
  "PL", # pylint see PLR2004...
  "PT", # pytest-style
  "PTH", # use-pathlib
  "PYI", # lint typeshed
  "Q", # quotes
  "RET", # Return
  "RSE", # Raise
  "RUF", # Ruff
  "S", # bandit
  "SIM", # simplify
  "SLF", # private self
  "SLOT", # __slot__
  "T10", # debugger
  "T20", # print
  "TC", # TYPE_CHECKING
  "TCH", # TYPE_CHECKING
  "TID", # tidy-imports
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle
  "YTT", # 2020
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["clophfit"]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"src/clophfit/__init__.py" = [
  "boolean-type-hint-positional-argument", # configure_logging has boolean arg for CLI compatibility
  "boolean-default-value-positional-argument", # configure_logging has boolean default for CLI compatibility
]
"src/clophfit/__main__.py" = [
  "module-import-not-at-top-of-file", # Imports after PYTENSOR_FLAGS env-var setup (must precede pytensor init)
  "boolean-type-hint-positional-argument", # Boolean args acceptable in CLI with Click
  "boolean-default-value-positional-argument", # Boolean defaults acceptable in CLI with Click
  "too-many-positional-arguments", # Many args acceptable in CLI commands
]
"*.ipynb" = [
  "missing-type-function-argument",
  "missing-type-args",
  "missing-type-kwargs",
  "missing-return-type-undocumented-public-function",
  "missing-return-type-private-function",
  "ARG",
  "undocumented-public-function",
  "ERA",
  "undefined-name", # Undefined names in notebooks (cells may define variables in execution order)
  "unconventional-import-alias",
  "invalid-function-name",
  "invalid-argument-name",
  "non-lowercase-variable-in-function",
  "mixed-case-variable-in-global-scope",
  "pandas-df-variable-name",
  "too-many-arguments",
  "too-many-positional-arguments", # Too many positional arguments - common in scientific functions
  "magic-value-comparison",
  "import-private-name",
  "ambiguous-unicode-character-string", # Ambiguous unicode characters (e.g., Greek letters in scientific notebooks)
  "hardcoded-password-func-arg", # False positives on parameter names like first_pass_method
  "private-member-access",
  "T20",
]
"__init__.py" = ["missing-required-import"] # don't need annotations
"docs/*" = ["INP"]
"tests/*" = [
  "magic-value-comparison",
  "float-equality-comparison", # Direct float comparisons are acceptable in tests for exact sentinel values
  "assert",
  "no-self-use", # Method could be function/static - pytest relies on self
]
"src/clophfit/fitting/model_validation.py" = [
  "any-type", # typing.Any for generic trace/dataset handling
  "blind-except", # Robustness wrappers catch broad exceptions
  "complex-structure", # trace_diagnostics is intentionally comprehensive
  "undocumented-public-function", # Docstrings on aggregation helpers (names are self-documenting)
  "pandas-use-of-dot-values", # xarray .values convention in scientific code
  "too-many-branches", # Branch complexity in trace_diagnostics
  "magic-value-comparison", # Domain-specific thresholds (2σ, 3σ, Pareto-k 0.7, etc.)
  "redefined-loop-name", # Loop var reassignment (sort_values in-place pattern)
]
"src/clophfit/fitting/ctr_validation.py" = [
  "any-type", # typing.Any for generic scheme/trace handling
  "signature-in-docstring", # Iterator docstring yields convention
  "docstring-missing-yields", # Yields section in docstring
  "pandas-use-of-dot-values", # xarray .values convention
  "redefined-loop-name", # Loop var reassignment (str coercion pattern)
]
"src/clophfit/fitting/diagnostic_plots.py" = [
  "too-many-arguments", # plot_residual_overview has many keyword options
  "too-many-statements", # plot_residual_overview has many statements (4-panel plot)
  "magic-value-comparison", # Domain-specific thresholds (min 3 points for correlation)
  "redefined-loop-name", # Loop var reassignment (sort_values in-place pattern)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.typos]

[tool.typos.default]
extend-ignore-re = [
  "\"id\":\\s*\"[^\"]+\"", # Ignore specific patterns such as "id": "XXXX" in JSON
  "\"metadata\":\\s*\\{[^}]*\\}", # Ignore all metadata fields inside .ipynb cells
]


[tool.typos.default.extend-words]
# ALS: alternating least squares (the MCR-ALS method). Without this the
# spell-checker "corrects" it to ALSO, corrupting the method's own name
# (both cases: identifiers are matched case-insensitively).
ALS = "ALS"
als = "als"
arange = "arange"
arosio = "Arosio"
setp = "setp"
ttest = "ttest"
thr = "thr"
yhat = "yhat"
